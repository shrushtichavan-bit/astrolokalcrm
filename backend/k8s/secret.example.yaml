# Template only — do NOT commit a real Secret with a real DATABASE_URL.
#
# Create the real one imperatively instead, e.g.:
#   kubectl create secret generic astrolokal-backend-db \
#     --from-literal=DATABASE_URL='postgres://user:password@host:5432/dbname'
#
# deployment.yaml expects a Secret named "astrolokal-backend-db" with a
# "DATABASE_URL" key, matching this shape.
apiVersion: v1
kind: Secret
metadata:
  name: astrolokal-backend-db
type: Opaque
stringData:
